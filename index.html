<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SilverConnect · Gateway to the Silver Economy</title>
<meta name="description" content="Zero-text safety check-ins, mood sharing, and a curated marketplace for the GBA silver economy.">
<meta name="theme-color" content="#E8748A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23E8748A'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%92%93%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#E8748A; --primary-dark:#c65a70;
    --secondary:#F4A261; --accent:#6BAF92; --bg:#F5EDE0; --text:#3D2C1E; --muted:#9A7060;
    --yellow:#F2C14E; --blue:#6C93B8; --gold:#D9A441; --surface:#FFFFFF;
    --r-sm:8px; --r-md:12px; --r-lg:20px; --r-circle:50%;
    --sh-sm:0 2px 8px rgba(61,44,30,0.08); --sh-md:0 4px 16px rgba(61,44,30,0.12); --sh-lg:0 8px 32px rgba(61,44,30,0.18);
    --tap:100px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif; background:linear-gradient(180deg,#EFE3D0 0%, var(--bg) 40%);
    color:var(--text); min-height:100vh; display:flex; flex-direction:column; align-items:center;
  }
  h1,h2,h3,.serif{font-family:'Lora',serif;}
  button{font-family:inherit;}
  a{color:inherit;}
  input{font-family:inherit;}

  /* ================= AUTH SCREENS ================= */
  .auth-wrap{
    width:100%; max-width:440px; min-height:100vh; display:flex; flex-direction:column;
    justify-content:center; padding:32px 24px;
  }
  .auth-brand{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:28px;}
  .auth-brand .mark{
    width:64px; height:64px; border-radius:18px; background:linear-gradient(135deg,var(--primary),var(--accent));
    display:flex; align-items:center; justify-content:center; font-size:32px; box-shadow:var(--sh-md);
  }
  .auth-brand .name{font-family:'Lora',serif; font-weight:700; font-size:22px;}
  .auth-brand .tag{font-size:12.5px; color:var(--muted);}
  .auth-card{background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--sh-md); padding:28px 24px;}
  .auth-title{font-size:20px; font-weight:700; margin:0 0 4px;}
  .auth-sub{font-size:13.5px; color:var(--muted); margin:0 0 20px; line-height:1.5;}
  .big-btn{
    width:100%; min-height:var(--tap); border:none; border-radius:var(--r-lg); background:var(--primary);
    color:#fff; font-weight:800; font-size:17px; cursor:pointer; box-shadow:var(--sh-md); margin-bottom:14px;
    transition:transform .15s ease; display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .big-btn:active{transform:scale(.97);}
  .big-btn.ghost{background:var(--surface); color:var(--text); border:2px solid rgba(61,44,30,0.12); box-shadow:none;}
  .big-btn.sage{background:var(--accent);}
  .big-btn:disabled{opacity:.4; cursor:not-allowed;}
  .field-label{font-size:12.5px; font-weight:800; color:var(--muted); margin:14px 0 6px; display:block;}
  .text-field{
    width:100%; min-height:56px; border-radius:var(--r-md); border:2px solid rgba(61,44,30,0.14);
    padding:0 16px; font-size:16px; color:var(--text); background:var(--bg); outline:none;
  }
  .text-field:focus{border-color:var(--primary);}
  .role-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:6px 0 8px;}
  .role-card{
    background:var(--bg); border:2px solid transparent; border-radius:var(--r-lg); padding:20px 12px;
    text-align:center; cursor:pointer; min-height:var(--tap);
  }
  .role-card .e{font-size:34px; display:block; margin-bottom:8px;}
  .role-card .l{font-weight:800; font-size:14px;}
  .role-card .s{font-size:11px; color:var(--muted); margin-top:2px;}
  .role-card.selected{border-color:var(--primary); background:rgba(232,116,138,0.08);}

  .pin-display{display:flex; justify-content:center; gap:14px; margin:18px 0;}
  .pin-dot{width:20px; height:20px; border-radius:50%; border:2px solid var(--muted); background:transparent;}
  .pin-dot.filled{background:var(--primary); border-color:var(--primary);}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:6px;}
  .key-btn{
    min-height:64px; border-radius:var(--r-md); border:none; background:var(--bg); font-size:22px; font-weight:800;
    color:var(--text); cursor:pointer; box-shadow:var(--sh-sm);
  }
  .key-btn:active{transform:scale(.95);}
  .key-btn.func{background:transparent; box-shadow:none; color:var(--muted); font-size:16px; font-weight:800;}

  .code-display{
    text-align:center; font-family:'Lora',serif; font-weight:700; font-size:34px; letter-spacing:8px;
    background:var(--bg); border-radius:var(--r-md); padding:18px 10px; margin:14px 0; color:var(--primary);
  }
  .step-dots{display:flex; justify-content:center; gap:6px; margin-bottom:18px;}
  .step-dot{width:8px; height:8px; border-radius:50%; background:rgba(61,44,30,0.15);}
  .step-dot.active{background:var(--primary); width:20px; border-radius:4px;}
  .error-banner{
    background:rgba(232,116,138,0.12); border:1px solid rgba(232,116,138,0.4); color:var(--primary-dark);
    font-size:13px; font-weight:700; padding:10px 14px; border-radius:var(--r-md); margin-bottom:14px;
  }
  .hint-banner{
    background:rgba(107,175,146,0.12); border:1px solid rgba(107,175,146,0.35); color:#3d7a5c;
    font-size:12.5px; padding:10px 14px; border-radius:var(--r-md); margin-top:16px; line-height:1.5;
  }
  .link-btn{
    background:none; border:none; color:var(--primary); font-weight:800; font-size:13.5px; cursor:pointer;
    text-align:center; width:100%; padding:8px; margin-top:4px;
  }
  .back-row{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .back-row button{background:none; border:none; font-size:20px; cursor:pointer; color:var(--muted); padding:4px;}

  /* ================= APP SHELL ================= */
  .app-shell{width:100%; max-width:1180px; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative;}
  .topbar{padding:16px 20px 12px; display:flex; align-items:center; justify-content:space-between; background:var(--bg); max-width:1180px; width:100%; margin:0 auto;}
  @media (min-width:860px){ .topbar{padding:22px 40px 16px;} }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center; font-size:19px; box-shadow:var(--sh-sm);}
  .brand-text .name{font-family:'Lora',serif; font-weight:700; font-size:16px; line-height:1.1;}
  .brand-text .tag{font-size:10px; color:var(--muted); letter-spacing:.02em;}

  .profile-wrap{position:relative;display:flex;align-items:center;gap:6px;}
  .profile-chip{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid rgba(61,44,30,0.08); border-radius:999px; padding:6px 14px 6px 6px; cursor:pointer; box-shadow:var(--sh-sm);}
  .profile-avatar{width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;}
  .profile-name{font-size:12.5px; font-weight:800; line-height:1.1; text-align:left;}
  .profile-role{font-size:10px; color:var(--muted);}
  .profile-menu{position:absolute; right:0; top:52px; background:#fff; border-radius:var(--r-md); box-shadow:var(--sh-lg); width:240px; padding:10px; display:none; z-index:30;}
  .profile-menu.open{display:block;}
  .profile-menu .item{display:block; width:100%; text-align:left; background:none; border:none; padding:12px 10px; border-radius:var(--r-sm); font-size:13.5px; font-weight:700; cursor:pointer; color:var(--text);}
  .profile-menu .item:hover{background:var(--bg);}
  .profile-menu .item.danger{color:var(--primary-dark);}
  .profile-menu hr{border:none; border-top:1px solid rgba(61,44,30,0.08); margin:6px 0;}
  .profile-menu .code-mini{font-family:'Lora',serif; font-weight:700; letter-spacing:4px; font-size:18px; color:var(--primary); text-align:center; padding:8px 0;}

  .mode-strip{text-align:center; font-size:11px; font-weight:700; letter-spacing:.03em; color:#fff; padding:6px 0; background:var(--primary);}
  .mode-strip.caretaker{background:var(--accent);}

  .tab-content{flex:1; padding:18px 20px 100px; max-width:720px; width:100%; margin:0 auto;}
  @media (min-width:860px){ .tab-content{padding:12px 40px 60px; max-width:900px;} }

  .bottom-nav{position:fixed; left:0; right:0; bottom:0; display:flex; background:#fff; border-top:1px solid rgba(61,44,30,0.08); padding:8px 8px calc(8px + env(safe-area-inset-bottom)); box-shadow:0 -4px 16px rgba(61,44,30,0.06); z-index:10;}
  .nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; padding:10px 4px; border-radius:14px; cursor:pointer; min-height:64px; color:var(--muted); font-weight:800;}
  .nav-item .emo{font-size:24px;} .nav-item .lbl{font-size:11px;}
  .nav-item.active{color:var(--primary); background:rgba(232,116,138,0.10);}

  .top-nav{display:none;}
  @media (min-width:860px){
    .bottom-nav{display:none;}
    .top-nav{display:flex; gap:8px; max-width:1180px; margin:0 auto; width:100%; padding:0 40px 8px; border-bottom:1px solid rgba(61,44,30,0.08);}
    .top-nav-item{display:flex; align-items:center; gap:8px; background:none; border:none; cursor:pointer; padding:10px 18px; border-radius:999px 999px 0 0; color:var(--muted); font-weight:800; font-size:14px;}
    .top-nav-item .emo{font-size:18px;}
    .top-nav-item.active{color:var(--primary); background:rgba(232,116,138,0.10);}
    .tab-content{padding-bottom:60px;}
  }

  .hero{height:110px; border-radius:var(--r-lg); margin-bottom:18px; position:relative; overflow:hidden; box-shadow:var(--sh-sm); display:flex; align-items:flex-end; padding:14px 16px;}
  .hero::after{content:""; position:absolute; inset:0; opacity:.16; background-image:radial-gradient(circle at 20% 20%, #fff 0 2px, transparent 3px), radial-gradient(circle at 80% 60%, #fff 0 2px, transparent 3px), radial-gradient(circle at 50% 85%, #fff 0 2px, transparent 3px); background-size:60px 60px;}
  .hero-label{position:relative; color:#fff; font-weight:800; font-size:13px; text-shadow:0 1px 3px rgba(0,0,0,.15);}
  .hero.rose-sage{background:linear-gradient(120deg,var(--primary),var(--accent));}
  .hero.amber-cream{background:linear-gradient(120deg,var(--secondary), #EFD9B0);}
  .hero.rose-yellow{background:linear-gradient(120deg,var(--primary),var(--yellow));}

  .page-title{font-size:26px; font-weight:700; margin:0 0 4px;}
  .page-sub{font-size:14px; color:var(--muted); margin:0 0 18px; line-height:1.4;}

  .card{background:var(--surface); border-radius:var(--r-md); padding:16px; box-shadow:var(--sh-sm); margin-bottom:14px;}
  .card h3{font-size:13px; margin:0 0 6px; font-weight:800;}
  .card p{font-size:13px; color:var(--muted); margin:0; line-height:1.5;}

  .heart-wrap{display:flex; flex-direction:column; align-items:center; margin:6px 0 22px;}
  .heart-btn{width:var(--tap); height:var(--tap); border-radius:50%; background:radial-gradient(circle at 35% 30%, #ff98ab, var(--primary) 65%); border:none; color:#fff; font-size:52px; cursor:pointer; box-shadow:0 10px 28px rgba(232,116,138,0.45); display:flex; align-items:center; justify-content:center; animation:pulse 2.4s ease-in-out infinite; transition:transform .15s ease;}
  .heart-btn:active{transform:scale(.94);}
  .heart-btn.sent{animation:none; background:radial-gradient(circle at 35% 30%, #86d9b3, var(--accent) 65%); box-shadow:0 10px 28px rgba(107,175,146,0.45);}
  @keyframes pulse{0%,100%{box-shadow:0 10px 28px rgba(232,116,138,0.45);} 50%{box-shadow:0 10px 44px rgba(232,116,138,0.65);}}
  @media (prefers-reduced-motion: reduce){ .heart-btn{animation:none;} }
  .success-msg{margin-top:14px; background:rgba(107,175,146,0.14); color:#3d7a5c; border:1px solid rgba(107,175,146,0.35); font-weight:800; font-size:13px; padding:10px 16px; border-radius:999px; opacity:0; transform:translateY(-4px); transition:all .3s ease; text-align:center;}
  .success-msg.show{opacity:1; transform:translateY(0);}

  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
  .stat-card{background:var(--surface); border-radius:var(--r-md); padding:12px 8px; text-align:center; box-shadow:var(--sh-sm);}
  .stat-card .val{font-family:'Lora',serif; font-size:24px; font-weight:700;}
  .stat-card .lbl{font-size:11px; color:var(--muted); font-weight:700;}
  .stat-card.sage .val{color:var(--accent);} .stat-card.amber .val{color:var(--secondary);}

  .alert-banner{display:flex; gap:10px; align-items:flex-start; background:#FDF1E4; border:1px solid rgba(244,162,97,0.4); border-radius:var(--r-md); padding:12px 14px; margin-bottom:16px;}
  .alert-banner .ic{font-size:20px;} .alert-banner .title{font-weight:800; font-size:13px;} .alert-banner .sub{font-size:12px; color:var(--muted);}

  .fam-card{display:flex; align-items:center; gap:12px; background:var(--surface); border-radius:var(--r-md); padding:12px 14px; margin-bottom:10px; box-shadow:var(--sh-sm);}
  .fam-emo{width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; background:var(--bg); flex:none;}
  .fam-emo.checked{background:rgba(107,175,146,0.18);} .fam-emo.alert{background:rgba(244,162,97,0.2);} .fam-emo.pending{background:rgba(154,112,96,0.15);}
  .fam-info{flex:1; min-width:0;} .fam-name{font-weight:800; font-size:14px;} .fam-relation{font-size:11.5px; color:var(--muted);}
  .fam-time{font-size:11px; color:var(--muted); font-weight:700; white-space:nowrap;} .fam-trend{font-size:14px; letter-spacing:2px; margin-top:2px;}
  .insight-card{background:linear-gradient(120deg,#FBF3E7,#F7E6D6); border:1px solid rgba(154,112,96,0.18);}

  .emoji-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px;}
  .emoji-btn{aspect-ratio:1/1; min-height:var(--tap); border-radius:var(--r-lg); border:2px solid transparent; background:var(--surface); box-shadow:var(--sh-sm); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; transition:all .18s ease;}
  .emoji-btn .e{font-size:36px;} .emoji-btn .l{font-size:12px; font-weight:800; color:var(--text);}
  .emoji-btn.selected{transform:scale(1.05); border-color:var(--primary); box-shadow:0 6px 18px rgba(232,116,138,.35);}
  .emoji-btn[data-tone="amber"].selected{border-color:var(--secondary);} .emoji-btn[data-tone="yellow"].selected{border-color:var(--yellow);}
  .emoji-btn[data-tone="blue"].selected{border-color:var(--blue);} .emoji-btn[data-tone="rose-pink"].selected{border-color:var(--primary);} .emoji-btn[data-tone="gold"].selected{border-color:var(--gold);}
  .share-btn{width:100%; min-height:var(--tap); border:none; border-radius:var(--r-lg); background:var(--primary); color:#fff; font-weight:800; font-size:16px; cursor:pointer; box-shadow:var(--sh-md); opacity:0; transform:translateY(8px); pointer-events:none; transition:all .25s ease;}
  .share-btn.ready{opacity:1; transform:translateY(0); pointer-events:auto;}
  .share-btn:active{transform:scale(.98);}

  .mood-strip{display:flex; justify-content:space-around; background:var(--surface); border-radius:var(--r-md); padding:16px 8px; margin-bottom:16px; box-shadow:var(--sh-sm);}
  .mood-strip .m{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--muted);}
  .mood-strip .m .e{font-size:26px;}

  .product-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:8px;}
  .product-card,.tour-card,.product-row{background:var(--surface); border-radius:var(--r-md); box-shadow:var(--sh-sm); text-decoration:none; color:var(--text); display:block; position:relative; overflow:hidden; transition:transform .15s ease;}
  .product-card:active,.tour-card:active,.product-row:active{transform:scale(.97);}
  .product-card{padding:14px; min-height:150px;}
  .product-card .badge,.tour-card .badge{position:absolute; top:10px; right:10px; background:var(--accent); color:#fff; font-size:10px; font-weight:800; padding:3px 8px; border-radius:999px;}
  .product-card .e{font-size:30px;} .product-card .n{font-weight:800; font-size:13.5px; margin-top:8px;}
  .product-card .d{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.35;} .product-card .p{font-weight:800; color:var(--primary); font-size:14px; margin-top:8px;}
  .section-title{font-family:'Lora',serif; font-weight:700; font-size:17px; margin:20px 0 12px;}
  .tour-card{padding:14px; margin-bottom:12px; display:flex; gap:12px; align-items:flex-start;}
  .tour-card .e{font-size:32px; flex:none;} .tour-card .n{font-weight:800; font-size:14.5px;} .tour-card .loc{font-size:11.5px; color:var(--muted); font-weight:700;}
  .tour-card .d{font-size:12px; color:var(--muted); margin-top:4px; line-height:1.4;}
  .tour-card .meta{display:flex; justify-content:space-between; align-items:center; margin-top:8px;}
  .tour-card .p{font-weight:800; color:var(--primary); font-size:13px;} .tour-card .acc{font-size:11px; color:var(--accent); font-weight:700;}
  .product-row{display:flex; align-items:center; gap:12px; padding:12px 14px; margin-bottom:10px;}
  .product-row .e{font-size:26px; flex:none;} .product-row .n{font-weight:800; font-size:13.5px;} .product-row .d{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .product-row .p{font-weight:800; color:var(--primary); font-size:13px; margin-left:auto; white-space:nowrap; padding-left:8px;}

  button:focus-visible, a:focus-visible, input:focus-visible{outline:3px solid var(--primary); outline-offset:2px;}
  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  .fade-in{animation:fadeIn .3s ease;} @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  @media (min-width:860px){
    .page-title{font-size:32px;} .hero{height:150px; padding:20px 28px;} .hero-label{font-size:16px;}
    .emoji-grid{grid-template-columns:repeat(6,1fr); gap:16px;} .product-grid{grid-template-columns:repeat(3,1fr); gap:16px;}
    .stat-row{max-width:520px;}
  }
  @media (min-width:1080px){ .product-grid{grid-template-columns:repeat(4,1fr);} }

  /* ---------- Modal overlay (external-link declaration, add family, PICS) ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(61,44,30,0.45); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:100;
  }
  .modal-box{background:#fff; border-radius:var(--r-lg); max-width:420px; width:100%; padding:24px; box-shadow:var(--sh-lg); max-height:85vh; overflow-y:auto;}
  .modal-box h2{font-size:18px; margin:0 0 10px;}
  .modal-box p{font-size:13.5px; color:var(--muted); line-height:1.55; margin:0 0 10px;}
  .modal-box .domain-chip{display:inline-block; background:var(--bg); color:var(--text); font-weight:800; padding:4px 10px; border-radius:999px; font-size:12.5px; margin:4px 0 12px;}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal-actions .big-btn{margin-bottom:0;}
  .pics-body h3{font-size:14px; margin:16px 0 6px;}
  .pics-body p, .pics-body li{font-size:12.5px; color:var(--muted); line-height:1.55;}
  .pics-body{max-height:60vh; overflow-y:auto; padding-right:4px; margin-bottom:14px;}

  .week-strip{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .week-day{flex:1; min-width:36px; text-align:center; background:var(--bg); border-radius:8px; padding:6px 2px;}
  .week-day .d{font-size:10px; font-weight:800; color:var(--muted);}
  .week-day .m{font-size:16px; line-height:1.2; margin-top:2px;}
  .week-day.on{background:rgba(107,175,146,0.18);}
  .week-day.off{opacity:.55;}
  .self-block{background:var(--surface); border-radius:var(--r-md); padding:16px; box-shadow:var(--sh-sm); margin-bottom:16px;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

function t(key){ return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key; }
function moodsList(){ return t('moods'); }

function renderWeekStrip(rows){
  if(!rows || !rows.length) return '<div class="week-strip"><span style="font-size:12px;color:var(--muted);">' + t('noHistory') + '</span></div>';
  const names = t('weekDays');
  return '<div class="week-strip">' + rows.map(r => {
    const dt = new Date(r.day + 'T12:00:00');
    const label = names[dt.getDay()];
    const on = r.checked_in;
    const emo = r.mood_emoji || (on ? '✓' : '·');
    return `<div class="week-day ${on?'on':'off'}" title="${r.mood_label||''}"><div class="d">${label}</div><div class="m">${emo}</div></div>`;
  }).join('') + '</div>';
}

async function loadMyWeekHistory(){
  if(!session) return;
  const {data, error} = await sb.rpc('get_week_history', {p_phone: session.phone});
  if(!error) myWeekHistory = data || [];
  render();
}

async function loadMemberHistory(phone){
  if(memberHistory[phone]) return;
  const {data, error} = await sb.rpc('get_week_history', {p_phone: phone});
  if(!error){ memberHistory[phone] = data || []; render(); }
}

let extLinkUrl = null, extLinkName = "", extLinkDomain = "";
function confirmExternalLink(url, name){
  extLinkUrl = url; extLinkName = name;
  try{ extLinkDomain = new URL(url).hostname.replace(/^www\./,''); } catch(e){ extLinkDomain = url; }
  render();

/* ---------- Add Family Member (caretaker linking additional seniors) ---------- */
let addFamOpen = false, addFamLabel = "", addFamCode = "", addFamError = "", addFamSuccess = "";
function openAddFamily(){ addFamOpen = true; addFamLabel=""; addFamCode=""; addFamError=""; addFamSuccess=""; profileMenuOpen=false; render(); }
function closeAddFamily(){ addFamOpen = false; render(); }
async function submitAddFamily(){
  if(busy || addFamCode.length!==6) return;
  busy = true; addFamError=""; render();
  const {data, error} = await sb.rpc('link_additional_family', {p_phone:session.phone, p_code:addFamCode, p_label: addFamLabel.trim()||null});
  busy = false;
  if(error){
    const msg = (error.message || error.details || error.hint || JSON.stringify(error) || "").toString();
    addFamError = msg.includes('CODE_NOT_FOUND') ? t('errCodeNotFound')
      : msg.includes('ALREADY_LINKED') ? t('errAlreadyLinked')
      : msg.includes('CANNOT_LINK_SELF') ? t('errCannotSelf')
      : msg.includes('USER_NOT_FOUND') ? t('errUserNotFound')
      : ("Could not link: " + msg);
    console.error("link_additional_family", error);
    render(); return;
  }
  addFamSuccess = `${t('linkedTo')} ${(data && data[0] && data[0].senior_name) || (lang==='zh'?'家庭':'family')}!`;
  caretakerData = null; memberHistory = {}; // force refresh
  render();
  loadCaretakerData();
}

/* ---------- Remove family link (both roles) ---------- */
async function removeFamily(code){
  if(busy || !code) return;
  if(!confirm(t('removeConfirm'))) return;
  busy = true; render();
  const {error} = await sb.rpc('unlink_family', {p_phone: session.phone, p_code: code});
  busy = false;
  if(error){
    const msg = (error.message || '').toString();
    alert(msg.includes('NOT_LINKED') ? t('errNotLinked') : t('errGeneric'));
    console.error('unlink_family', error);
    render(); return;
  }
  caretakerData = null; memberHistory = {}; myCaretakers = null;
  render();
  loadCaretakerData();
  loadMyCaretakers();
}

async function removeLinkedMember(memberPhone){
  if(busy || !memberPhone) return;
  if(!confirm(t('removeConfirm'))) return;
  busy = true; render();
  const {error} = await sb.rpc('remove_linked_member', {p_owner_phone: session.phone, p_member_phone: memberPhone});
  busy = false;
  if(error){
    const msg = (error.message || '').toString();
    alert(msg.includes('NOT_LINKED') ? t('errNotLinked') : t('errGeneric'));
    console.error('remove_linked_member', error);
    render(); return;
  }
  myCaretakers = null; caretakerData = null; memberHistory = {};
  render();
  loadMyCaretakers();
  loadCaretakerData();
}

function pressKey(target, digit, maxLen){
  let val = target==='loginPin'?loginPin : target==='regPin'?regPin : target==='addFamCode'?addFamCode : regCode;
  if(val.length>=maxLen) return;
  val += digit;
  if(target==='loginPin') loginPin=val; else if(target==='regPin') regPin=val; else if(target==='addFamCode') addFamCode=val; else regCode=val;
  render();
}

  render();
}

  const {data, error} = await sb.rpc('login', {p_phone: loginPhone, p_pin: loginPin});
  busy = false;
  if(error || !data || data.length===0){
    authError = t('errLogin');
    loginPin = "";
    render();
    return;
  }
  const u = data[0];
  session = {phone:u.phone, name:u.name, role:u.role, familyCode:u.family_code}; myWeekHistory=null; memberHistory={}; caretakerData=null;
  authView="welcome"; loginPhone=""; loginPin=""; authError="";
  render();
}

let regResult = null;

function pickRole(role){ regRole = role; render(); }
async function regNext(){
  authError = "";
  if(regStep===1){
    if(!regRole){ authError=t('errChooseRole'); render(); return; }
    regStep=2; render(); return;
  }
  if(regStep===2){
    if(!regName.trim() || regPhone.trim().length<6){ authError=t('errNamePhone'); render(); return; }
    if(!regPicsAgreed){ authError=t('errPics'); render(); return; }
    regStep=3; render(); return;
  }
  if(regStep===3){
    if(regPin.length!==4){ authError=t('errPin'); render(); return; }
    if(busy) return;
    busy = true; render();
    const fn = regRole==='senior' ? 'register_senior' : 'register_caretaker';
    const {data, error} = await sb.rpc(fn, {p_name:regName.trim(), p_phone:regPhone.trim(), p_pin:regPin});
    busy = false;
    if(error){
      authError = error.message.includes('PHONE_TAKEN') ? t('errPhoneTaken') : t('errGeneric');
      regStep = 2; render(); return;
    }
    regResult = data[0];
    regGeneratedCode = regResult.family_code;
    regStep = 4; render(); return;
  }
}
function continueAfterRegister(){
  session = {phone:regResult.phone, name:regResult.name, role:regResult.role, familyCode:regResult.family_code};
  authView="welcome"; render();
}
function regBack(){
  authError="";
  if(regStep>1){ regStep--; render(); } else { authView="welcome"; render(); }
}
function logout(){ session=null; profileMenuOpen=false; tab="heartbeat"; checkedIn=false; selectedMood=null; moodShared=false; caretakerData=null; myCaretakers=null; addFamOpen=false; render(); }

}

/* ---------- Keypad renderer ---------- */
function renderKeypad(target, value, len){
  const dots = Array.from({length:len}).map((_,i)=>`<div class="pin-dot ${i<value.length?'filled':''}"></div>`).join('');
  const keys = [1,2,3,4,5,6,7,8,9];
  let grid = keys.map(k=>`<button type="button" class="key-btn" onclick="pressKey('${target}',${k},${len})">${k}</button>`).join('');
  grid += `<button type="button" class="key-btn func" onclick="render()"></button>`;
  grid += `<button type="button" class="key-btn" onclick="pressKey('${target}',0,${len})">0</button>`;
  grid += `<button type="button" class="key-btn func" onclick="backspaceKey('${target}')" aria-label="Delete">⌫</button>`;
  return `<div class="pin-display">${dots}</div><div class="keypad">${grid}</div>`;
}

      <div style="font-size:10px; color:var(--muted); margin-top:4px;">via ${t.merchant} ↗</div></div></a>`).join('');
  const careRows = careProducts.map(p=>`
    <a class="product-row" href="${p.url}" onclick="event.preventDefault(); confirmExternalLink('${p.url}', '${p.n.replace(/'/g,"\\'")}');">

    <div class="hero rose-yellow"><span class="hero-label">${t('exploreTogether')}</span></div>
    <h1 class="page-title">${t('gbaHub')}</h1>

}

async function sendCheckIn(){
  if(busy || checkedIn) return;
  busy = true; render();
  const {error} = await sb.rpc('send_checkin', {p_phone: session.phone});
  busy = false;
  if(!error){ checkedIn = true; myWeekHistory=null; loadMyWeekHistory(); }
  render();
}
function selectMood(i){ selectedMood=i; moodShared=false; render(); }
async function shareMood(){
  if(selectedMood===null || busy) return;
  const m = moodsList()[selectedMood];
  busy = true; render();
  const {error} = await sb.rpc('share_mood', {p_phone: session.phone, p_emoji:m.emoji, p_label:m.label});
  busy = false;
  if(!error){ moodShared = true; myWeekHistory=null; loadMyWeekHistory(); }
  render();
}
async function loadCaretakerData(){
  if(caretakerLoading) return;
  caretakerLoading = true;
  const {data, error} = await sb.rpc('get_my_families', {p_phone: session.phone});
  caretakerLoading = false;
  if(!error){
    caretakerData = data || [];
    (caretakerData||[]).forEach(d => { if(d.senior_phone) loadMemberHistory(d.senior_phone); });
  }
  render();
}
function reloadCaretakerData(){ caretakerData = null; memberHistory = {}; myWeekHistory = null; render(); loadCaretakerData(); loadMyWeekHistory(); }

/* ================= MASTER RENDER ================= */
function render(){
  const root = document.getElementById('root');
  if(NEEDS_SETUP){
    root.innerHTML = `<div class="auth-wrap fade-in">${renderSetupNeeded()}</div>`;
    return;
  }
  let inner;
  if(!session){
    let authInner = authView==='login' ? renderLogin() : authView==='register' ? renderRegister() : renderWelcome();
    inner = `<div class="auth-wrap fade-in">${authInner}</div>`;
  } else {
    inner = renderApp();
  }
  root.innerHTML = inner + renderExternalLinkModal() + renderAddFamilyModal() + renderPicsModal();
}
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
